<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071a3d">
<title>Akses Server · Kota Naratama</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0a2a5c;--bg2:#06142e;--gold:#d4a02e;--gold2:#f2d27a;--tx:#eef3fc;--mut:#a9b9d4;--glass:#ffffff14;--line:#ffffff2b;--bad:#ff8585;--ok:#5be0a8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#08224d;--bg2:#040d20}}
:root[data-theme="dark"]{--bg1:#08224d;--bg2:#040d20}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--tx);font:15px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg2);overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 520px at 85% -10%,#d4a02e30,transparent 60%),radial-gradient(700px 500px at -10% 105%,#3b6fd433,transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2))}
.bg:after{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at 50% 40%,#000 0,transparent 75%);-webkit-mask-image:radial-gradient(circle at 50% 40%,#000 0,transparent 75%);animation:drift 24s linear infinite}
@keyframes drift{to{background-position:44px 44px,44px 44px}}
.wrap{min-height:100vh;display:grid;place-items:center;padding:22px 16px}
.card{width:100%;max-width:410px;background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:26px 22px 20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 70px #00000066;animation:in .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.97)}}
.logo{width:150px;height:150px;margin:-62px auto 8px;background:#fff;border-radius:34px;display:grid;place-items:center;box-shadow:0 18px 40px #0007,0 0 0 4px #ffffff22;animation:float 5s ease-in-out infinite}.logo img{width:124px;height:auto;display:block}
@keyframes float{50%{transform:translateY(-6px)}}
h1{font:700 24px 'Cinzel',Georgia,serif;letter-spacing:3px;text-align:center;margin:12px 0 2px;background:linear-gradient(135deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--mut);font-size:13px;margin:0 0 18px}
label{display:block;font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
.f{position:relative}
input[type=text],input[type=password]{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:#0000003a;color:var(--tx);font:inherit;font-size:16px;outline:none;transition:.2s}
input::placeholder{color:#8da0c0}input:focus{border-color:var(--gold);box-shadow:0 0 0 4px #d4a02e30}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);width:42px;height:42px;border-radius:12px;cursor:pointer;font-size:12px;font-weight:800}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:13px;color:var(--mut)}
.row label{display:flex;align-items:center;gap:8px;margin:0;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;cursor:pointer}.row input{accent-color:var(--gold);width:16px;height:16px}
a{color:var(--gold2);font-weight:700;text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
.btn{width:100%;margin-top:18px;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:800;font-size:15px;letter-spacing:.4px;cursor:pointer;color:#2a1c00;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 12px 26px #d4a02e45;transition:transform .15s,filter .15s}
.btn:active{transform:scale(.97);filter:brightness(.92)}.btn.o{background:transparent;color:var(--tx);border:1.5px solid var(--line);box-shadow:none;margin-top:12px}
#err{min-height:20px;margin-top:12px;color:var(--bad);font-size:13px;font-weight:700;text-align:center}
.shake{animation:shake .45s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.proto{margin-top:16px;border:1px dashed #ffffff40;border-radius:14px;padding:10px 12px;font-size:12px;color:var(--mut)}
.proto summary{cursor:pointer;font-weight:800;color:var(--gold2)}.proto code{background:#0000004a;padding:2px 6px;border-radius:6px;color:#fff}.proto button{margin-top:8px;border:1px solid var(--line);background:#ffffff14;color:var(--tx);border-radius:10px;padding:7px 12px;font:inherit;font-weight:700;font-size:12px;cursor:pointer}
.foot{text-align:center;margin-top:14px;font-size:11px;color:#8da0c0}
/* loading */
.load{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:24px;background:radial-gradient(800px 500px at 50% 30%,#1b4a9a55,transparent 65%),linear-gradient(160deg,var(--bg1),var(--bg2))}.load.on{display:grid;animation:fi .5s both}@keyframes fi{from{opacity:0}}
.lb{width:100%;max-width:380px;text-align:center}
.lw{position:relative;width:176px;height:176px;margin:0 auto 26px}
.lw .logo{position:absolute;inset:14px;width:auto;height:auto;margin:0;border-radius:40px;animation:none}.lw .logo img{width:104px}
.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--gold2),#d4a02e00 72%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));animation:spin 1.3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.lb h2{font:700 20px 'Cinzel',Georgia,serif;letter-spacing:2px;margin:0 0 6px}.lb .st{color:var(--mut);min-height:22px;font-size:14px}
.bar{height:10px;border-radius:10px;background:#ffffff1f;overflow:hidden;margin:20px 0 8px}.bar i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,var(--gold),var(--gold2));position:relative;overflow:hidden}.bar i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffff77,transparent);transform:translateX(-100%);animation:sh 1.4s infinite}@keyframes sh{to{transform:translateX(100%)}}
.pc{font-weight:800;font-size:13px;color:var(--gold2)}
.tip{margin-top:22px;min-height:44px;font-size:13px;color:var(--mut);transition:opacity .4s}.tip b{display:block;color:var(--tx);font-size:11px;letter-spacing:1.5px;margin-bottom:3px}
.ok{display:none}.done .ok{display:block}.done .busy{display:none}
.chk{width:92px;height:92px;margin:0 auto 22px;display:block;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}.chk circle{fill:none;stroke:var(--ok);stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151;animation:dr .6s forwards}.chk path{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:dr .4s .5s forwards}@keyframes dr{to{stroke-dashoffset:0}}@keyframes pop{from{transform:scale(.4);opacity:0}}
#open{display:none}#open.show{display:block;animation:fi .5s both}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

.mt{margin:0 0 14px;padding:10px 12px;border-radius:12px;background:#d4a02e22;border:1px solid #d4a02e66;color:var(--gold2);font-size:13px;font-weight:700;text-align:center}
.ts{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#fff;color:#0a2a5c;padding:11px 18px;border-radius:12px;z-index:90;display:none;font-weight:800;font-size:13px;max-width:90%;box-shadow:0 10px 24px #0006}
.md{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:70}.md.on{display:flex}
.md>div{background:linear-gradient(160deg,#0d2f66,#07163a);border:1px solid var(--line);width:100%;max-width:460px;border-radius:24px 24px 0 0;padding:20px 22px calc(22px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;animation:up .3s cubic-bezier(.2,.9,.3,1)}@keyframes up{from{transform:translateY(60px);opacity:0}}
.md h3,.adm h3{margin:0 0 6px;font:700 17px 'Cinzel',Georgia,serif;letter-spacing:1px;color:var(--gold2)}.mut{color:var(--mut);font-size:12px}
.md input,.adm input[type=text],.adm input[type=password]{padding:12px 14px;font-size:15px}
.adm{position:fixed;inset:0;z-index:60;display:none;overflow:auto;background:linear-gradient(160deg,var(--bg1),var(--bg2));padding:calc(16px + env(safe-area-inset-top,0px)) 16px 40px}.adm.on{display:block}
.adm .in{max-width:520px;margin:0 auto}.ah{display:flex;align-items:center;gap:10px;margin-bottom:14px}.ah b{font:700 18px 'Cinzel',Georgia,serif;letter-spacing:2px;color:var(--gold2);flex:1}
.sm{width:auto!important;margin:0!important;padding:9px 14px!important;font-size:12px!important}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);background:#ffffff0f;color:var(--tx);font:inherit;font-weight:800;font-size:12px;cursor:pointer}.tabs button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a1c00;border-color:transparent}
.pn{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.st4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.st4 div{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px}.st4 b{display:block;font:700 24px 'Cinzel',serif;color:var(--gold2)}.st4 span{font-size:11px;color:var(--mut)}
.it{padding:12px 0;border-bottom:1px dashed var(--line)}.it:last-child{border:0}.it .t{display:flex;gap:8px;align-items:center;justify-content:space-between}.it small{display:block;color:var(--mut);font-size:11px}
.acts{display:flex;gap:6px}.acts button{border:1.5px solid var(--line);background:none;color:var(--tx);border-radius:10px;padding:6px 10px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.acts .d{color:var(--bad)}
.bd{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;margin-left:6px}.bd.b{background:#ff858533;color:var(--bad)}.bd.g{background:#5be0a833;color:var(--ok)}
.sw{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:700;font-size:14px;cursor:pointer}.sw input{width:20px;height:20px;accent-color:var(--gold)}
.adml{margin:110px 0 10px;text-align:right}.adml a{display:inline-block;padding:8px 6px;font-size:11px;color:var(--mut);opacity:.45;cursor:pointer;text-decoration:none}
</style></head><body>

<script>
const SB_URL='https://jxokllsrgxienhmmmlan.supabase.co',SB_KEY='sb_publishable_Iu7zzWjuBLuHWYS0wNkENA_rUAltodk';
const STAGES=[[0,'Memverifikasi identitas IC'],[22,'Mencocokkan data penduduk'],[48,'Menyiapkan koneksi ke server'],[72,'Mengamankan sesi masuk'],[90,'Membuka Roblox']];
const TIPS=[['PERATURAN','Patuhi peraturan Kota Naratama selama bermain.'],['ROLEPLAY','Gunakan nama IC saat roleplay, bukan nama aslimu.'],['SOPAN SANTUN','Hormati warga dan petugas kota.'],['LAPORAN','Ada pelanggaran? Laporkan ke staff Naratama.']];

const $=id=>document.getElementById(id);
let tries=0,lockUntil=0,raf=0,iv=0,tm=[],busy=false,dest='';
const norm=s=>s.trim().replace(/\s+/g,' ').toLowerCase();
const has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
function msg(m){const e=$('err'),c=$('card');e.textContent=m;[e,c].forEach(x=>{x.classList.remove('shake');void x.offsetWidth;x.classList.add('shake')})}
function togglePw(){const p=$('pw'),s=p.type==='password';p.type=s?'text':'password';$('eye').textContent=s?'SEMBUNYI':'LIHAT';$('eye').setAttribute('aria-label',s?'Sembunyikan password':'Tampilkan password')}
function forgot(){msg('Hubungi staff Naratama untuk mereset password.')}
async function submitLogin(ev){ev.preventDefault();if(busy)return false;
 const now=Date.now();if(now<lockUntil){msg('Terlalu banyak percobaan. Coba lagi '+Math.ceil((lockUntil-now)/1000)+' detik.');return false}
 const ic=$('ic').value.trim(),pw=$('pw').value;
 if(!ic||!pw){msg('Isi IC dan password dulu.');return false}
 busy=true;$('go').textContent='MEMERIKSA...';let j;
 try{j=await rpc('nrt_ic_login',{p_ic:ic,p_pw:pw})}catch(e){busy=false;$('go').textContent='MASUK KE SERVER';msg(emsg(e));return false}
 busy=false;$('go').textContent='MASUK KE SERVER';
 if(!j||!j.ok){tries++;if(tries>=5){tries=0;lockUntil=Date.now()+30000}msg((j&&j.error)||'Terjadi kesalahan.');return false}
 if(!/^https:\/\//.test(j.url)){msg('Link server tidak valid. Hubungi admin.');return false}
 tries=0;dest=j.url;try{if($('rm').checked)localStorage.setItem('ns_ic',ic);else localStorage.removeItem('ns_ic')}catch(e){}
 $('err').textContent='';startLoad(j.name);return false}
function setTip(i){const t=TIPS[i%TIPS.length],e=$('tip');e.style.opacity=0;setTimeout(()=>{e.innerHTML='<b>'+t[0]+'</b>'+t[1];e.style.opacity=1},250)}
function startLoad(ic){const L=$('load'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,dur=reduce?2200:6500,t0=performance.now();
 $('lb').classList.remove('done');$('open').classList.remove('show');$('open').style.display='none';$('bar').style.width='0';$('pc').textContent='0%';$('wel').textContent='SELAMAT DATANG, '+ic.toUpperCase();
 L.classList.add('on');let ti=0;setTip(0);iv=setInterval(()=>setTip(++ti),2600);
 const step=now=>{const p=Math.min(1,(now-t0)/dur),e=Math.min(1,p+0.04*Math.sin(p*12)*(1-p)),pct=Math.floor(e*100);
  $('bar').style.width=pct+'%';$('pc').textContent=pct+'%';let s=STAGES[0][1];for(const g of STAGES)if(pct>=g[0])s=g[1];$('stg').textContent=s;
  if(p<1)raf=requestAnimationFrame(step);else finish()};
 raf=requestAnimationFrame(step)}
function finish(){clearInterval(iv);$('lb').classList.add('done');const a=$('open');a.href=dest;
 tm.push(setTimeout(()=>{location.assign(dest)},1200));tm.push(setTimeout(()=>{a.style.display='block';a.classList.add('show')},2800))}
function cancelLoad(){dest='';cancelAnimationFrame(raf);clearInterval(iv);tm.forEach(clearTimeout);tm=[];$('load').classList.remove('on');$('lb').classList.remove('done');$('pw').value='';$('pw').focus()}
try{const s=localStorage.getItem('ns_ic');if(s){$('ic').value=s;$('rm').checked=true;$('pw').focus()}}catch(e){}

const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gv=id=>($(id)||{}).value||'';
const emsg=e=>e.message==='Failed to fetch'?'Tidak bisa terhubung ke server':e.message;
async function rpc(fn,args){
 if(SB_URL.startsWith('ISI_')||SB_KEY.startsWith('ISI_'))throw new Error('Isi SB_URL dan SB_KEY dulu di file ini');
 const h={'Content-Type':'application/json',apikey:SB_KEY};if(SB_KEY.startsWith('eyJ'))h.Authorization='Bearer '+SB_KEY;
 const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args||{})});
 const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||'Terjadi kesalahan');return j}
function toast(m){const t=$('ts');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2800)}

tring(x==null?'':x).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst emsg=e=>e.message==='Failed to fetch'?'Tidak bisa terhubung ke server':e.message;\nasync function rpc(fn,args){const h={'Content-Type':'application/json',apikey:SB_KEY};if(SB_KEY.startsWith('eyJ'))h.Authorization='Bearer '+SB_KEY;\n const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args||{})});\n const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||'Terjadi kesalahan');return j}\nfunction toast(m){const t=$('ts');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2800)}\nfunction modal(h){$('md').innerHTML='<div>'+h+'<\/div>';$('md').classList.add('on')}\nfunction closeM(){$('md').classList.remove('on')}\n$('md').addEventListener('click',e=>{if(e.target.id==='md')closeM()});\nconst fd=t=>new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});\nconst fdt=t=>new Date(t).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});\nconst KN={warga:'Warga',usaha:'Usaha',fraksi:'Fraksi'};\nconst CS={warga:[['Nama asli','real_name'],['Umur asli','real_age'],['Username','username'],['Nama IC','ic_name'],['Umur IC','ic_age']],\n usaha:[['Nama usaha','name'],['Jenis usaha','utype'],['Nama pemilik','owner_name'],['Username pemilik','owner_user'],['Deskripsi','descr'],['Status','status'],['Catatan admin','admin_note']],\n fraksi:[['Jenis fraksi','ftype'],['Sisi','side'],['Nama fraksi','name'],['Singkatan','abbr'],['Deskripsi','descr'],['Ketua','leader'],['Wakil ketua','vice'],['Dibentuk','founded'],['Tujuan','goal'],['Username ketua','leader_user'],['Nomor ketua','leader_phone'],['Username wakil','vice_user'],['Nomor wakil','vice_phone'],['Grup WhatsApp','wa_link'],['Status','status'],['Catatan admin','admin_note']]};\nlet A={tok:null,tab:'ring',q:'',f:'semua',d:null,set:null,logs:[]};\nasync function login(){const v=gv('ap');if(!v)return toast('Isi password admin');\n try{A.tok=await rpc('nrt_admin_login',{p_pw:v});$('login').classList.add('hide');$('app').classList.remove('hide');$('ap').value='';await load()}catch(e){toast(emsg(e))}}\nfunction out(){A={tok:null,tab:'ring',q:'',f:'semua',d:null,set:null,logs:[]};$('app').classList.add('hide');$('app').innerHTML='';$('login').classList.remove('hide');if(window.parent!==window)parent.postMessage('nrt-close','*')}\nfunction err(e){if(/Sesi/.test(e.message))out();toast(emsg(e))}\nasync function load(){const get=fn=>rpc(fn,{p_token:A.tok}).then(v=>[v,null],e=>[null,e]);\n const[[d,e1],[s,e2],[l,e3]]=await Promise.all([get('nrt_admin_all'),get('nrt_admin_get_settings'),get('nrt_admin_logs')]);\n if(e1&&/Sesi/.test(e1.message)){out();return toast(emsg(e1))}\n A.d=d||{warga:[],usaha:[],fraksi:[]};A.set=s;A.logs=l||[];A.e=[e1,e2,e3].filter(Boolean).map(emsg);render()}\nfunction tab(t){A.tab=t;A.q='';A.f='semua';render()}\nconst mainOf=(k,r)=>k==='warga'?r.ic_name:k==='usaha'?r.name:r.name+' ('+r.abbr+')';\nconst subOf=(k,r)=>k==='warga'?'@'+r.username:k==='usaha'?'Pemilik: '+r.owner_name:r.ftype+' \u00b7 '+r.side;\nconst SL={menunggu:'MENUNGGU',diterima:'DITERIMA',revisi:'REVISI',ditolak:'DITOLAK'},SC={menunggu:'w',diterima:'g',revisi:'v',ditolak:'b'};\nconst stb=r=>r.status?`<span class=\"bd ${SC[r.status]}\">${SL[r.status]}<\/span>`:'';\nconst pend=k=>((A.d||{})[k]||[]).filter(r=>r.status==='menunggu').length;\nconst chips=()=>`<div class=\"chips\">${['semua','menunggu','diterima','revisi','ditolak'].map(s=>`<button class=\"${A.f===s?'on':''}\" onclick=\"A.f='${s}';render()\">${s==='semua'?'Semua':SL[s][0]+SL[s].slice(1).toLowerCase()}<\/button>`).join('')}<\/div>`;\nfunction rows(){const k=A.tab,q=A.q.toLowerCase();\n return((A.d||{})[k]||[]).filter(r=>(k==='warga'||A.f==='semua'||r.status===A.f)&&(!q||JSON.stringify(r).toLowerCase().includes(q))).map(r=>`<div class=\"it\"><div class=\"t\"><div><b>${esc sword\" autocomplete=\"off\"><label for=\"an\">Password baru (min. 8 karakter)<\/label><input id=\"an\" type=\"password\" autocomplete=\"off\"><button class=\"btn\" onclick=\"setPw()\">SIMPAN PASSWORD<\/button><\/div>`;\n else if(A.tab==='log')b=`<div class=\"pn\"><h3>Log Login (100 terakhir)<\/h3>${A.logs.map(l=>`<div class=\"it\"><div class=\"t\"><div><b>${esc(l.ic_name)}<\/b><span class=\"bd ${l.ok?'g':'b'}\">${l.ok?'BERHASIL':'GAGAL'}<\/span><small>${esc(l.reason||'')} \u00b7 ${fdt(l.at)}<\/small><\/div><\/div><\/div>`).join('')||'<p class=\"mut\">Belum ada log<\/p>'}${A.logs.length?'<button class=\"btn o\" onclick=\"clearLogs()\">Bersihkan Log<\/button>':''}<\/div>`;\n else b=`<div class=\"pn\"><h3>${KN[A.tab]} (${n(A.tab)})<\/h3>${A.tab!=='warga'?chips():''}<input id=\"aq\" type=\"text\" placeholder=\"Cari data\" value=\"${esc(A.q)}\" oninput=\"A.q=this.value;$('al').innerHTML=rows()\" style=\"margin-top:8px\"><div id=\"al\" style=\"margin-top:6px\">${rows()}<\/div><button class=\"btn\" onclick=\"csv()\">UNDUH CSV ${KN[A.tab].toUpperCase()}<\/button><\/div>`;\n const ew=(A.e&&A.e.length)?`<div class=\"pn\" style=\"border-color:#ff8585\"><h3>Sebagian data gagal dimuat<\/h3>${[...new Set(A.e)].map(m=>`<div class=\"mut\" style=\"color:#ffb3b3\">${esc(m)}<\/div>`).join('')}<div class=\"mut\" style=\"margin-top:8px\">Biasanya karena SQL belum dijalankan semua. Jalankan SQL bagian 1 sampai 13 di Supabase, lalu jalankan: notify pgrst, 'reload schema';<\/div><\/div>`:'';\n $('app').innerHTML=`<div class=\"top\"><h1>PANEL ADMIN<\/h1><button class=\"btn o sm\" onclick=\"load()\">Muat Ulang<\/button><button class=\"btn sm\" onclick=\"out()\">Keluar<\/button><\/div><div class=\"tabs\">${[['ring','Ringkasan'],['warga','Warga'],['usaha','Usaha'],['fraksi','Fraksi'],['log','Log']].map(x=>`<button class=\"${A.tab===x[0]?'on':''}\" onclick=\"tab('${x[0]}')\">${x[1]}${pend(x[0])?' ('+pend(x[0])+')':''}<\/button>`).join('')}<\/div>${ew}${b}`}\nfunction review(k,c){const r=A.d[k].find(x=>x.code===c);if(!r)return;\n modal(`<h3>${esc(mainOf(k,r))}<\/h3><div class=\"mut\">${esc(r.code)} \u00b7 ${fd(r.created_at)} ${stb(r)}<\/div><div class=\"sum\" style=\"margin-top:10px\">${CS[k].filter(x=>x[1]!=='status'&&x[1]!=='admin_note').map(([l,f])=>`<div><span>${l}<\/span><b>${esc(r[f])}<\/b><\/div>`).join('')}<\/div><label for=\"rn\">Catatan untuk pemain<\/label><textarea id=\"rn\" maxlength=\"500\" placeholder=\"Wajib untuk Revisi atau Ditolak. Jelaskan bagian mana yang perlu diperbaiki.\">${esc(r.admin_note||'')}<\/textarea><button class=\"btn g\" onclick=\"rv('${k}','${c}','diterima')\">TERIMA (ACC)<\/button><button class=\"btn\" onclick=\"rv('${k}','${c}','revisi')\">MINTA REVISI<\/button><button class=\"btn r\" onclick=\"rv('${k}','${c}','ditolak')\">TOLAK<\/button><button class=\"btn o\" onclick=\"closeM()\">Tutup<\/button>`)}\nasync function rv(k,c,st){const n=gv('rn').trim();if((st==='revisi'||st==='ditolak')&&n.length<5)return toast('Isi catatan: jelaskan bagian yang perlu direvisi atau alasan penolakan');\n try{await rpc('nrt_admin_review',{p_token:A.tok,p_kind:k,p_code:c,p_status:st,p_note:n});closeM();toast({diterima:'Pendaftaran diterima',revisi:'Permintaan revisi dikirim',ditolak:'Pendaftaran ditolak'}[st]);await load()}catch(e){err(e)}}\nfunction detail(k,c){const r=A.d[k].find(x=>x.code===c);if(!r)return;modal(`<h3>${esc(mainOf(k,r))}<\/h3><div class=\"mut\">${esc(r.code)} \u00b7 ${fd(r.created_at)}<\/div><div class=\"sum\" style=\"margin-top:10px\">${CS[k].map(([l,f])=>`<div><span>${l}<\/span><b>${esc(r[f])}<\/b><\/div>`).join('')}<\/div><button class=\"btn o\" onclick=\"closeM()\">Tutup<\/button>`)}\nfunction del(k,c){modal(`<h3>Hapus data?<\/h3><p>${esc(c)}<\/p><div class=\"mut\">Data ini dihapus permanen dan tidak bisa dikembalikan.<\/div><button class=\"btn r\" onclick=\"delDo('${k}','${c}')\">YA, HAPUS<\/button><button class=\"btn o\" onclick=\"closeM()\">Batal<\/button>`)}\nasync function delDo(k,c){closeM();try{await rpc('nrt_admin_delete',{p_token:A.tok,p_kind:k,p_code:c});toast('Data dihapus');await load()}catch(e){err(e)}}\nasync function block(c,v){try{await rpc('nrt_admin_set_block',{p_token:A.tok,p_code:c,p_block:v});toast(v?'Akun diblokir':'Blokir dibuka');await load()}catch(e){err(e)}}\nfunction tmpPw(){const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789',a=new Uint32Array(8);crypto.getRandomValues(a);return[...a].map(x=>c[x%c.length]).join('')}\nfunction reset(c){const r=A.d.warga.find(x=>x.code===c);if(!r)return;modal(`<h3>Reset Password IC<\/h3><p style=\"margin:4px 0\">${esc(r.ic_name)} \u00b7 @${esc(r.username)}<\/p><div class=\"mut\">Password sementara dibuat otomatis (boleh diubah). Berikan ke pemain, lalu minta dia menggantinya lewat website pendaftaran.<\/div><label for=\"rp\">Password baru<\/label><input id=\"rp\" type=\"text\" value=\"${tmpPw()}\" autocomplete=\"off\" maxlength=\"30\"><button class=\"btn\" onclick=\"resetDo('${c}')\">RESET PASSWORD<\/button><button class=\"btn o\" onclick=\"closeM()\">Batal<\/button>`)}\nasync function resetDo(c){const p=gv('rp');if(p.length<4)return toast('Password minimal 4 karakter');\n try{await rpc('nrt_admin_reset_password',{p_token:A.tok,p_code:c,p_new:p});modal(`<h3>Password direset<\/h3><div class=\"mut\">Berikan password ini ke pemain. Tidak ditampilkan lagi setelah ditutup.<\/div><div style=\"font:800 26px ui-monospace,monospace;text-align:center;letter-spacing:2px;margin:18px 0;word-break:break-all\">${esc(p)}<\/div><button class=\"btn\" onclick=\"navigator.clipboard&&navigator.clipboard.writeText('${esc(p)}').then(()=>toast('Tersalin'))\">SALIN PASSWORD<\/button><button class=\"btn o\" onclick=\"closeM()\">Tutup<\/button>`)}catch(e){err(e)}}\nasync function save(){try{await rpc('nrt_admin_set_settings',{p_token:A.tok,p_url:gv('su'),p_maint:$('sm').checked,p_msg:gv('sg')});toast('Pengaturan tersimpan');await load()}catch(e){err(e)}}\nasync function setPw(){const o=gv('ao'),n=gv('an');if(!o)return toast('Isi password lama');if(n.length<8)return toast('Password baru minimal 8 karakter');\n try{await rpc('nrt_admin_set_password',{p_token:A.tok,p_old:o,p_new:n});toast('Password diganti, silakan masuk lagi');out()}catch(e){err(e)}}\nasync function clearLogs(){try{await rpc('nrt_admin_clear_logs',{p_token:A.tok});toast('Log dibersihkan');await load()}catch(e){err(e)}}\nfunction csv(){const k=A.tab,L=(A.d||{})[k]||[];if(!L.length)return toast('Belum ada data '+KN[k]);\n const cell=x=>{x=String(x==null?'':x);if(/^[=@]/.test(x)||(/^[+\\-]/.test(x)&&!/^[+\\-]?\\d[\\d\\s-]*$/.test(x)))x=\"'\"+x;return '\"'+x.replace(/\"/g,'\"\"')+'\"'};\n const c='\\ufeff'+[['Kode','Tanggal Daftar',...CS[k].map(x=>x[0])],...L.map(r=>[r.code,fd(r.created_at),...CS[k].map(x=>r[x[1]])])].map(r=>r.map(cell).join(',')).join('\\r\\n');\n try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='naratama-'+k+'.csv';document.body.appendChild(a);a.click();a.remove()}\n catch(e){modal(`<h3>Data CSV<\/h3><div class=\"mut\">Salin teks ini lalu tempel ke file .csv<\/div><textarea readonly style=\"width:100%;height:200px;margin-top:10px\" onclick=\"this.select()\">${esc(c)}<\/textarea><button class=\"btn o\" onclick=\"closeM()\">Tutup<\/button>`)}}\n<\/script><\/body><\/html>";
