<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pendaftaran · Kota Naratama</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
.lg{display:inline-grid;place-items:center;background:#fff;border-radius:14px;flex:none;box-shadow:0 4px 14px #0003}.lg img{display:block}
.lgf{display:inline-block;background:#fff;border-radius:22px;padding:14px 20px;box-shadow:0 10px 26px #0004;position:relative}.lgf img{display:block;width:200px;height:auto}

:root{--bg:#f3eee4;--card:#fffdf9;--tx:#1a2435;--mut:#6f7686;--navy:#16304f;--steel:#41587a;--acc:#16304f;--green:#4f7d57;--green2:#7bb083;--gold:#b98a2e;--line:#e6dfd0;--bad:#c94545;--ok:#2f9461;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07111f;--card:#0f1d31;--tx:#eaf0f8;--mut:#8da0ba;--navy:#3a68a8;--steel:#5f8acb;--acc:#a7c4f2;--gold:#e0b54f;--line:#1d2e48;--green:#6fae78}}
:root[data-theme="dark"]{--bg:#07111f;--card:#0f1d31;--tx:#eaf0f8;--mut:#8da0ba;--navy:#3a68a8;--steel:#5f8acb;--acc:#a7c4f2;--gold:#e0b54f;--line:#1d2e48;--green:#6fae78}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--tx);font:14px/1.5 'Sora',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(var(--line) 1px,transparent 1.5px) 0 0/22px 22px,var(--bg);overflow-x:hidden}
main{max-width:460px;margin:0 auto;padding:18px 18px 40px}
header,.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header .k,.top .k{font-size:9px;letter-spacing:4px;color:var(--mut);font-weight:700;line-height:1}
header b,.top b{font:700 19px 'Fraunces',Georgia,serif;color:var(--acc);display:block;line-height:1.2}header .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 12px 30px #1a243514;animation:fade .4s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(12px)}}
h3{margin:0 0 6px;font:700 18px 'Fraunces',Georgia,serif}
label{display:block;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin:16px 0 2px}
input{width:100%;padding:10px 2px;border:0;border-bottom:2px solid var(--line);border-radius:0;background:transparent;color:var(--tx);font:inherit;font-size:17px;font-weight:600;outline:none;transition:border-color .2s}
input:focus{border-bottom-color:var(--green)}input::placeholder{color:var(--mut);opacity:.5;font-weight:400}
.btn{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--navy);color:#fff;font:inherit;font-weight:700;font-size:14px;letter-spacing:.5px;cursor:pointer;transition:transform .15s,filter .15s}
.btn:active{transform:scale(.96);filter:brightness(.9)}
.btn.g{background:var(--green)}.btn.r{background:var(--bad)}.btn.o{background:transparent;color:var(--tx);border:2px solid var(--line)}
.btn.s{width:auto;padding:9px 14px;margin:0;font-size:13px}
.idc{--navy:#fff;--steel:#c7d6ee;--green:#9fd7a8;position:relative;aspect-ratio:1.586;border-radius:20px;padding:18px;color:#fff;background:linear-gradient(135deg,#0d2340,#1d4272 58%,#2a6b68);box-shadow:0 22px 44px #0a1a3066;overflow:hidden;margin-bottom:18px;animation:fade .5s ease-out}
.idc:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 88% 8%,#ffffff2b,transparent 45%),repeating-linear-gradient(115deg,#ffffff0a 0 2px,transparent 2px 11px)}
.idc .wm{position:absolute;right:-18px;bottom:-30px;opacity:.1}
.idc .hd{display:flex;align-items:center;gap:10px;position:relative}.idc .t1{font-size:8px;letter-spacing:2.5px;opacity:.75}.idc .t2{font:700 15px 'Fraunces',Georgia,serif;letter-spacing:1px}
.idc .chp{margin-left:auto;width:34px;height:26px;border-radius:6px;background:linear-gradient(135deg,#f0cd72,#b98a2e);box-shadow:inset 0 0 0 1px #ffffff55}
.idc .bd{display:flex;gap:14px;margin-top:14px;position:relative}
.idc .av{width:62px;height:76px;border-radius:12px;background:#ffffff1f;border:1px solid #ffffff44;display:grid;place-items:center;font:700 28px 'Fraunces',Georgia,serif;flex:none}
.idc dl{margin:0;display:grid;gap:7px;min-width:0}.idc dt{font-size:8px;letter-spacing:2px;opacity:.65}.idc dd{margin:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.idc .ft{position:absolute;left:18px;right:18px;bottom:13px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:2.5px;opacity:.85}
.stamp{position:absolute;right:16px;top:44%;transform:rotate(-14deg);border:3px solid #7bd99a;color:#7bd99a;font-weight:800;letter-spacing:3px;padding:3px 12px;border-radius:8px;font-size:17px;background:#0d234099;animation:stamp .5s .3s both cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{from{opacity:0;transform:rotate(-14deg) scale(2.4)}}
.stp{display:flex;align-items:flex-start;margin-bottom:6px}
.stp .s{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--mut);flex:none;width:60px}
.stp .s i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;background:var(--line);color:var(--mut);transition:.3s}
.stp .s.on{color:var(--tx)}.stp .s.on i{background:var(--navy);color:#fff;box-shadow:0 0 0 5px #3a68a826}.stp .s.dn i{background:var(--green);color:#fff}
.stp u{flex:1;height:3px;background:var(--line);margin:13px 0 0;border-radius:2px;transition:.3s}.stp u.dn{background:var(--green)}
.sb{animation:slide .35s ease}@keyframes slide{from{opacity:0;transform:translateX(26px)}}
.br{display:flex;gap:10px}.br .btn.o{flex:0 0 36%}
.sum{margin-top:14px}.sum div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}.sum div:last-child{border:0}.sum span{color:var(--mut);font-size:12px}.sum b{text-align:right;word-break:break-word}
.hint{font-size:12px;font-weight:700;margin-top:6px;min-height:16px}.hint.ok{color:var(--ok)}.hint.warn{color:#c58a1d}.hint.bad{color:var(--bad)}
.foot{text-align:center;margin:8px 0;color:var(--mut)}.foot a{font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline;margin:0 8px}
.done{text-align:center}.done h2{margin:0 0 4px;font:700 24px 'Fraunces',Georgia,serif;color:var(--ok)}
.icc{display:flex;align-items:center;gap:12px;text-align:left;padding:12px;border-radius:14px;background:var(--bg);margin-top:10px;animation:fade .4s both}
.icc .av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--navy);flex:none}.icc small{color:var(--mut);display:block}
.slots{display:flex;gap:6px;justify-content:center;margin:14px 0 6px}.slots i{width:34px;height:8px;border-radius:5px;background:var(--line)}.slots i.on{background:var(--green)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.stats .card{margin:0;padding:14px}
.stats b{display:block;font:700 28px 'Fraunces',Georgia,serif;color:var(--acc);line-height:1.1}.stats span{font-size:11px;color:var(--mut);font-weight:600}
.row{padding:14px 0;border-bottom:1px dashed var(--line)}.row:last-child{border:0}.row .top{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:0}
.row small{color:var(--mut);display:block}
.acts{display:flex;gap:6px}.acts button{border:2px solid var(--line);background:none;color:var(--tx);border-radius:10px;padding:5px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.acts .d{color:var(--bad)}
.warnb{background:#c58a1d22;border:1px solid #c58a1d66;color:#c58a1d;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:600;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#md{position:fixed;inset:0;background:#0009;backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:9}
#md.on{display:flex}#md>div{background:var(--card);width:100%;max-width:460px;border-radius:24px 24px 0 0;padding:14px 22px calc(22px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;animation:up .3s cubic-bezier(.2,.9,.3,1)}
#md>div:before{content:"";display:block;width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(60px);opacity:0}}
#ts{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:20;display:none;font-weight:700;max-width:90%;box-shadow:0 10px 24px #0004}
.mut{color:var(--mut);font-size:12px}

.seg{display:flex;gap:8px;margin-bottom:16px}.seg button{flex:1;padding:11px 4px;border:2px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.chip{padding:8px 14px;border:2px solid var(--line);background:none;color:var(--tx);border-radius:20px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
textarea{width:100%;padding:10px 2px;border:0;border-bottom:2px solid var(--line);background:transparent;color:var(--tx);font:inherit;font-size:16px;font-weight:600;outline:none;resize:none;min-height:70px}textarea:focus{border-bottom-color:var(--green)}
#cw .idc{animation:none}a.btn{display:block;text-align:center;text-decoration:none}.mut.c{text-align:center}.done .mut{text-align:center}
.idc.u{background:linear-gradient(135deg,#3b2a0d,#7a5a16 55%,#b98a2e)}.idc.bad{background:linear-gradient(135deg,#2a0d12,#5b1420 55%,#1b1b24)}.idc.good{background:linear-gradient(135deg,#0b2a1f,#14573f 55%,#1d3a52)}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1px;padding:2px 8px;border-radius:10px;background:var(--line);color:var(--mut);margin-right:6px}textarea.imp{min-height:110px;font-size:13px;font-weight:400;border:2px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.adml{margin:110px 0 10px;text-align:right}.adml a{display:inline-block;padding:8px 6px;font-size:11px;color:var(--mut);opacity:.45;cursor:pointer;text-decoration:none}
</style></head><body>

async function rpc(fn,args){
 if(SB_URL.startsWith('ISI_')||SB_KEY.startsWith('ISI_'))throw new Error('Isi SB_URL dan SB_KEY dulu di file ini');
 const h={'Content-Type':'application/json',apikey:SB_KEY};if(SB_KEY.startsWith('eyJ'))h.Authorization='Bearer '+SB_KEY;
 const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args||{})});
 const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||'Terjadi kesalahan');return j}
async function saveBlob(n,b){try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){await d.save({filename:n,data:b});return true}}}catch(e){}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();return true}catch(e){return false}}
function hint(){const el=document.querySelector('[data-f=user]'),h=$('#hint');clearTimeout(ht);if(!h||!el)return;const u=cl(el.value).replace(/^@/,'');
 if(!/^[A-Za-z0-9_]{3,20}$/.test(u)){h.textContent='';h.className='hint';return}
 ht=setTimeout(async()=>{try{const n=await rpc('nrt_count',{p_user:u});S.cnt[u.toLowerCase()]=n;const e=$('#hint');if(!e)return;
  e.className='hint '+(n>=3?'bad':n?'warn':'ok');e.textContent=n>=3?'Slot penuh: username ini sudah punya 3 IC':n?`Username ini sudah punya ${n} IC · sisa ${3-n} slot`:'Username belum terdaftar · tersedia 3 slot'}catch(e){}},450)}

  try{const n=await rpc('nrt_count',{p_user:u});S.cnt[u.toLowerCase()]=n;if(n>=3){S.busy=0;return toast('Username ini sudah mendaftarkan 3 IC (batas maksimal)')}}catch(x){S.busy=0;return toast(emsg(x))}S.busy=0}

 if(k==='warga'){fn='nrt_register_warga';a={p_real:g('real'),p_rage:+g('rage'),p_user:pn('user'),p_ic:g('ic'),p_iage:+g('iage'),p_pw:f.icpw}}

 if(S.rev&&k!=='warga'){fn=fn.replace('register','resubmit');a={p_code:S.rev.code,p_user:S.rev.user,...a}}
 S.busy=1;let j;try{j=await rpc(fn,a)}catch(e){S.busy=0;return toast(emsg(e))}S.busy=0;

 if(k==='warga')S.cnt[rec.user.toLowerCase()]=j.count;

function stModal(c,u){modal(`<h3>Cek Status Izin</h3><div class="mut">Untuk pendaftaran usaha atau fraksi. Username: pemilik usaha, atau ketua/wakil fraksi.</div><label>Kode pendaftaran</label><input id="c_code" autocapitalize="characters" placeholder="NRT-SIU-… atau NRT-KTF-…" value="${esc(c||'')}"><label>Username Roblox</label><input id="c_user" autocapitalize="none" maxlength="21" placeholder="username" value="${esc(u||'')}"><button class="btn" onclick="stGo()">Cek Status</button><button class="btn o" onclick="closeM()">Tutup</button>`)}
async function stGo(){const code=gv2('c_code').trim().toUpperCase(),u=gv2('c_user').trim().replace(/^@/,'');
 if(!/^NRT-(SIU|KTF)-\d{4}-[A-Z0-9]{6}$/.test(code))return toast('Kode tidak valid (NRT-SIU-… atau NRT-KTF-…)');
 if(!/^[A-Za-z0-9_]{3,20}$/.test(u))return toast('Username tidak valid');
 let j;try{j=await rpc('nrt_reg_status',{p_code:code,p_user:u})}catch(e){return toast(emsg(e))}
 if(!j||!j.found)return toast('Data tidak ditemukan. Cek kode dan username.');
 window._st={j:j,u:u};const rec=recFrom(j,u),all=recs().filter(x=>x.code!==rec.code);all.unshift(rec);try{localStorage.setItem('nrt_cards',JSON.stringify(all.slice(0,20)))}catch(e){}

 else if(j.status==='menunggu')modal(`<h3>Menunggu persetujuan</h3><div class="mut">${esc(j.data.name)} masih ditinjau admin. Cek lagi nanti.</div><button class="btn o" onclick="closeM()">Tutup</button>`)
 else if(j.status==='revisi')modal(`<h3>Perlu revisi</h3><div class="mut">${esc(j.data.name)}: admin meminta perbaikan.</div>${note}<button class="btn g" onclick="revStart()">Perbaiki &amp; Kirim Ulang</button><button class="btn o" onclick="closeM()">Tutup</button>`)
 else modal(`<h3>Pendaftaran ditolak</h3><div class="mut">${esc(j.data.name)} tidak disetujui.</div>${note}<button class="btn g" onclick="closeM();again2('${j.kind}')">Daftar Ulang</button><button class="btn o" onclick="closeM()">Tutup</button>`)}

 return{kind:k,code:d.code,date:dt,card:view(k,f),rows:rows,user:u,status:j.status}}

tring(x==null?'':x).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst emsg=e=>e.message==='Failed to fetch'?'Tidak bisa terhubung ke server':e.message;\nasync function rpc(fn,args){const h={'Content-Type':'application/json',apikey:SB_KEY};if(SB_KEY.startsWith('eyJ'))h.Authorization='Bearer '+SB_KEY;\n const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args||{})});\n const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||'Terjadi kesalahan');return j}\nfunction toast(m){const t=$('ts');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2800)}\nfunction modal(h){$('md').innerHTML='<div>'+h+'<\/div>';$('md').classList.add('on')}\nfunction closeM(){$('md').classList.remove('on')}\n$('md').addEventListener('click',e=>{if(e.target.id==='md')closeM()});\nconst fd=t=>new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});\nconst fdt=t=>new Date(t).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});\nconst KN={warga:'Warga',usaha:'Usaha',fraksi:'Fraksi'};\nconst CS={warga:[['Nama asli','real_name'],['Umur asli','real_age'],['Username','username'],['Nama IC','ic_name'],['Umur IC','ic_age']],\n usaha:[['Nama usaha','name'],['Jenis usaha','utype'],['Nama pemilik','owner_name'],['Username pemilik','owner_user'],['Deskripsi','descr'],['Status','status'],['Catatan admin','admin_note']],\n fraksi:[['Jenis fraksi','ftype'],['Sisi','side'],['Nama fraksi','name'],['Singkatan','abbr'],['Deskripsi','descr'],['Ketua','leader'],['Wakil ketua','vice'],['Dibentuk','founded'],['Tujuan','goal'],['Username ketua','leader_user'],['Nomor ketua','leader_phone'],['Username wakil','vice_user'],['Nomor wakil','vice_phone'],['Grup WhatsApp','wa_link'],['Status','status'],['Catatan admin','admin_note']]};\nlet A={tok:null,tab:'ring',q:'',f:'semua',d:null,set:null,logs:[]};\nasync function login(){const v=gv('ap');if(!v)return toast('Isi password admin');\n try{A.tok=await rpc('nrt_admin_login',{p_pw:v});$('login').classList.add('hide');$('app').classList.remove('hide');$('ap').value='';await load()}catch(e){toast(emsg(e))}}\nfunction out(){A={tok:null,tab:'ring',q:'',f:'semua',d:null,set:null,logs:[]};$('app').classList.add('hide');$('app').innerHTML='';$('login').classList.remove('hide');if(window.parent!==window)parent.postMessage('nrt-close','*')}\nfunction err(e){if(/Sesi/.test(e.message))out();toast(emsg(e))}\nasync function load(){const get=fn=>rpc(fn,{p_token:A.tok}).then(v=>[v,null],e=>[null,e]);\n const[[d,e1],[s,e2],[l,e3]]=await Promise.all([get('nrt_admin_all'),get('nrt_admin_get_settings'),get('nrt_admin_logs')]);\n if(e1&&/Sesi/.test(e1.message)){out();return toast(emsg(e1))}\n A.d=d||{warga:[],usaha:[],fraksi:[]};A.set=s;A.logs=l||[];A.e=[e1,e2,e3].filter(Boolean).map(emsg);render()}\nfunction tab(t){A.tab=t;A.q='';A.f='semua';render()}\nconst mainOf=(k,r)=>k==='warga'?r.ic_name:k==='usaha'?r.name:r.name+' ('+r.abbr+')';\nconst subOf=(k,r)=>k==='warga'?'@'+r.username:k==='usaha'?'Pemilik: '+r.owner_name:r.ftype+' \u00b7 '+r.side;\nconst SL={menunggu:'MENUNGGU',diterima:'DITERIMA',revisi:'REVISI',ditolak:'DITOLAK'},SC={menunggu:'w',diterima:'g',revisi:'v',ditolak:'b'};\nconst stb=r=>r.status?`<span class=\"bd ${SC[r.status]}\">${SL[r.status]}<\/span>`:'';\nconst pend=k=>((A.d||{})[k]||[]).filter(r=>r.status==='menunggu').length;\nconst chips=()=>`<div class=\"chips\">${['semua','menunggu','diterima','revisi','ditolak'].map(s=>`<button class=\"${A.f===s?'on':''}\" onclick=\"A.f='${s}';render()\">${s==='semua'?'Semua':SL[s][0]+SL[s].slice(1).toLowerCase()}<\/button>`).join('')}<\/div>`;\nfunction rows(){const k=A.tab,q=A.q.toLowerCase();\n return((A.d||{})[k]||[]).filter(r=>(k==='warga'||A.f==='semua'||r.status===A.f)&&(!q||JSON.stringify(r).toLowerCase().includes(q))).map(r=>`<div class=\"it\"><div class=\"t\"><div><b>${esc sword\" autocomplete=\"off\"><label for=\"an\">Password baru (min. 8 karakter)<\/label><input id=\"an\" type=\"password\" autocomplete=\"off\"><button class=\"btn\" onclick=\"setPw()\">SIMPAN PASSWORD<\/button><\/div>`;\n else if(A.tab==='log')b=`<div class=\"pn\"><h3>Log Login (100 terakhir)<\/h3>${A.logs.map(l=>`<div class=\"it\"><div class=\"t\"><div><b>${esc(l.ic_name)}<\/b><span class=\"bd ${l.ok?'g':'b'}\">${l.ok?'BERHASIL':'GAGAL'}<\/span><small>${esc(l.reason||'')} \u00b7 ${fdt(l.at)}<\/small><\/div><\/div><\/div>`).join('')||'<p class=\"mut\">Belum ada log<\/p>'}${A.logs.length?'<button class=\"btn o\" onclick=\"clearLogs()\">Bersihkan Log<\/button>':''}<\/div>`;\n else b=`<div class=\"pn\"><h3>${KN[A.tab]} (${n(A.tab)})<\/h3>${A.tab!=='warga'?chips():''}<input id=\"aq\" type=\"text\" placeholder=\"Cari data\" value=\"${esc(A.q)}\" oninput=\"A.q=this.value;$('al').innerHTML=rows()\" style=\"margin-top:8px\"><div id=\"al\" style=\"margin-top:6px\">${rows()}<\/div><button class=\"btn\" onclick=\"csv()\">UNDUH CSV ${KN[A.tab].toUpperCase()}<\/button><\/div>`;\n const ew=(A.e&&A.e.length)?`<div class=\"pn\" style=\"border-color:#ff8585\"><h3>Sebagian data gagal dimuat<\/h3>${[...new Set(A.e)].map(m=>`<div class=\"mut\" style=\"color:#ffb3b3\">${esc(m)}<\/div>`).join('')}<div class=\"mut\" style=\"margin-top:8px\">Biasanya karena SQL belum dijalankan semua. Jalankan SQL bagian 1 sampai 13 di Supabase, lalu jalankan: notify pgrst, 'reload schema';<\/div><\/div>`:'';\n $('app').innerHTML=`<div class=\"top\"><h1>PANEL ADMIN<\/h1><button class=\"btn o sm\" onclick=\"load()\">Muat Ulang<\/button><button class=\"btn sm\" onclick=\"out()\">Keluar<\/button><\/div><div class=\"tabs\">${[['ring','Ringkasan'],['warga','Warga'],['usaha','Usaha'],['fraksi','Fraksi'],['log','Log']].map(x=>`<button class=\"${A.tab===x[0]?'on':''}\" onclick=\"tab('${x[0]}')\">${x[1]}${pend(x[0])?' ('+pend(x[0])+')':''}<\/button>`).join('')}<\/div>${ew}${b}`}\nfunction review(k,c){const r=A.d[k].find(x=>x.code===c);if(!r)return;\n modal(`<h3>${esc(mainOf(k,r))}<\/h3><div class=\"mut\">${esc(r.code)} \u00b7 ${fd(r.created_at)} ${stb(r)}<\/div><div class=\"sum\" style=\"margin-top:10px\">${CS[k].filter(x=>x[1]!=='status'&&x[1]!=='admin_note').map(([l,f])=>`<div><span>${l}<\/span><b>${esc(r[f])}<\/b><\/div>`).join('')}<\/div><label for=\"rn\">Catatan untuk pemain<\/label><textarea id=\"rn\" maxlength=\"500\" placeholder=\"Wajib untuk Revisi atau Ditolak. Jelaskan bagian mana yang perlu diperbaiki.\">${esc(r.admin_note||'')}<\/textarea><button class=\"btn g\" onclick=\"rv('${k}','${c}','diterima')\">TERIMA (ACC)<\/button><button class=\"btn\" onclick=\"rv('${k}','${c}','revisi')\">MINTA REVISI<\/button><button class=\"btn r\" onclick=\"rv('${k}','${c}','ditolak')\">TOLAK<\/button><button class=\"btn o\" onclick=\"closeM()\">Tutup<\/button>`)}\nasync function rv(k,c,st){const n=gv('rn').trim();if((st==='revisi'||st==='ditolak')&&n.length<5)return toast('Isi catatan: jelaskan bagian yang perlu direvisi atau alasan penolakan');\n try{await rpc('nrt_admin_review',{p_token:A.tok,p_kind:k,p_code:c,p_status:st,p_note:n});closeM();toast({diterima:'Pendaftaran diterima',revisi:'Permintaan revisi dikirim',ditolak:'Pendaftaran ditolak'}[st]);await load()}catch(e){err(e)}}\nfunction detail(k,c){const r=A.d[k].find(x=>x.code===c);if(!r)return;modal(`<h3>${esc(mainOf(k,r))}<\/h3><div class=\"mut\">${esc(r.code)} \u00b7 ${fd(r.created_at)}<\/div><div class=\"sum\" style=\"margin-top:10px\">${CS[k].map(([l,f])=>`<div><span>${l}<\/span><b>${esc(r[f])}<\/b><\/div>`).join('')}<\/div><button class=\"btn o\" onclick=\"closeM()\">Tutup<\/button>`)}\nfunction del(k,c){modal(`<h3>Hapus data?<\/h3><p>${esc(c)}<\/p><div class=\"mut\">Data ini dihapus permanen dan tidak bisa dikembalikan.<\/div><button class=\"btn r\" onclick=\"delDo('${k}','${c}')\">YA, HAPUS<\/button><button class=\"btn o\" onclick=\"closeM()\">Batal<\/button>`)}\nasync function delDo(k,c){closeM();try{await rpc('nrt_ sword lama');if(n.length<8)return toast('Password baru minimal 8 karakter');\n try{await rpc('nrt_admin_set_password',{p_token:A.tok,p_old:o,p_new:n});toast('Password diganti, silakan masuk lagi');out()}catch(e){err(e)}}\nasync function clearLogs(){try{await rpc('nrt_admin_clear_logs',{p_token:A.tok});toast('Log dibersihkan');await load()}catch(e){err(e)}}\nfunction csv(){const k=A.tab,L=(A.d||{})[k]||[];if(!L.length)return toast('Belum ada data '+KN[k]);\n const cell=x=>{x=String(x==null?'':x);if(/^[=@]/.test(x)||(/^[+\\-]/.test(x)&&!/^[+\\-]?\\d[\\d\\s-]*$/.test(x)))x=\"'\"+x;return '\"'+x.replace(/\"/g,'\"\"')+'\"'};\n const c='\\ufeff'+[['Kode','Tanggal Daftar',...CS[k].map(x=>x[0])],...L.map(r=>[r.code,fd(r.created_at),...CS[k].map(x=>r[x[1]])])].map(r=>r.map(cell).join(',')).join('\\r\\n');\n try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='naratama-'+k+'.csv';document.body.appendChild(a);a.click();a.remove()}\n catch(e){modal(`<h3>Data CSV<\/h3><div class=\"mut\">Salin teks ini lalu tempel ke file .csv<\/div><textarea readonly style=\"width:100%;height:200px;margin-top:10px\" onclick=\"this.select()\">${esc(c)}<\/textarea><button class=\"btn o\" onclick=\"closeM()\">Tutup<\/button>`)}}\n<\/script><\/body><\/html>";
